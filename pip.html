<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cek Dana PIP - SD Negeri Kakatua</title>
    <style>
        /* Tema Ceria SD */
        :root {
            --primary: #FF6B6B; /* Merah Muda Ceria */
            --secondary: #4ECDC4; /* Hijau Toska */
            --accent: #FFE66D; /* Kuning Matahari */
            --background: #F7FFF7;
            --text: #2F3E46;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            padding: 20px; 
            background-color: var(--background);
            color: var(--text);
        }

        .container { 
            max-width: 600px; 
            margin: auto; 
            background: white; 
            padding: 30px; 
            border-radius: 25px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            border: 5px solid var(--secondary);
        }

        h2 { 
            text-align: center; 
            color: var(--primary);
            font-size: 24px;
            margin-bottom: 5px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }

        .subtitle {
            text-align: center;
            color: var(--secondary);
            font-weight: bold;
            margin-bottom: 30px;
            display: block;
        }

        .search-section { 
            margin-bottom: 25px; 
            background: #fff9db;
            padding: 15px;
            border-radius: 15px;
            border: 2px dashed var(--primary);
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: var(--primary);
        }

        select { 
            width: 100%;
            padding: 12px; 
            font-size: 16px; 
            border-radius: 12px; 
            border: 2px solid var(--secondary); 
            cursor: pointer;
            outline: none;
            background-color: white;
        }

        .result-card { 
            border: 3px solid var(--accent); 
            padding: 20px; 
            border-radius: 20px; 
            background-color: #fff; 
            display: none; 
            animation: fadeIn 0.5s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-card.active { display: block; }

        .data-row { 
            display: flex; 
            border-bottom: 1px solid #f0f0f0; 
            padding: 10px 0; 
        }

        .label { font-weight: bold; width: 130px; color: #777; }
        .value { font-weight: bold; color: var(--text); flex: 1; }
        
        .status-box {
            margin-top: 15px;
            background-color: var(--primary);
            color: white;
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            font-size: 18px;
        }

        .footer-note {
            text-align: center;
            font-size: 12px;
            color: #aaa;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🌟 Cek Pencairan PIP 🌟</h2>
    <span class="subtitle">UPT SPF SD NEGERI KAKATUA</span>

    <div class="search-section">
        <label for="nameSelect">Cari Nama Siswa di Sini:</label>
        <select id="nameSelect" onchange="showData()">
            <option value="">-- Pilih Nama Siswa (Urut Kelas) --</option>
        </select>
    </div>

    <div id="resultCard" class="result-card">
        <div class="data-row"><div class="label">Nama Lengkap</div><div class="value" id="resNama"></div></div>
        <div class="data-row"><div class="label">Kelas</div><div class="value" id="resKelas"></div></div>
        <div class="data-row"><div class="label">NISN</div><div class="value" id="resNISN"></div></div>
        <div class="data-row"><div class="label">Tempat Lahir</div><div class="value" id="resTempat"></div></div>
        <div class="data-row"><div class="label">Tgl Lahir</div><div class="value" id="resTgl"></div></div>
        
        <div class="status-box">
            📅 <strong>Jadwal Pencairan:</strong><br>
            <span id="resCair"></span>
        </div>
    </div>
    
    <div class="footer-note">Data berdasarkan lampiran PIP Desember 2025</div>
</div>

    ];

    const selectEl = document.getElementById('nameSelect');
    
    // 1. Sort berdasarkan Kelas (numerik) kemudian Nama (alfabetis)
    dataPIP.sort((a, b) => {
        if (a.kelas !== b.kelas) {
            return a.kelas - b.kelas;
        }
        return a.nama.localeCompare(b.nama);
    });

    // 2. Masukkan ke dropdown dengan format "NAMA (Kelas X)"
    dataPIP.forEach((item, index) => {
        let option = document.createElement('option');
        option.value = index;
        option.textContent = `${item.nama} (Kelas ${item.kelas})`;
        selectEl.appendChild(option);
    });

    function showData() {
        const selectedIndex = selectEl.value;
        const card = document.getElementById('resultCard');
        
        if (selectedIndex === "") {
            card.classList.remove('active');
            return;
        }

        const person = dataPIP[selectedIndex];
        document.getElementById('resNama').textContent = person.nama;
        document.getElementById('resKelas').textContent = person.kelas;
        document.getElementById('resNISN').textContent = person.nisn;
        document.getElementById('resTempat').textContent = person.tempat;
        document.getElementById('resTgl').textContent = person.tgl;
        document.getElementById('resCair').textContent = "Paling cepat tanggal " + person.cair;
        
        card.classList.add('active');
    }
</script>

</body>
</html>
