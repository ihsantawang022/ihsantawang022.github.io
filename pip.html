        h2 { text-align: center; color: #2c3e50; }
        .search-section { margin-bottom: 20px; display: flex; flex-direction: column; gap: 10px; }
        select { padding: 10px; font-size: 16px; border-radius: 5px; border: 1px solid #ccc; cursor: pointer; }
        .result-card { border: 1px solid #ddd; padding: 15px; border-radius: 8px; background-color: #fafafa; display: none; }
        .result-card.active { display: block; }
        .data-row { display: flex; border-bottom: 1px solid #eee; padding: 8px 0; }
        .label { font-weight: bold; width: 150px; color: #555; }

    // Mengisi dropdown otomatis
    const selectEl = document.getElementById('nameSelect');
    dataPIP.sort((a, b) => a.nama.localeCompare(b.nama)).forEach((item, index) => {
        let option = document.createElement('option');
        option.value = index;
        option.textContent = item.nama;
        selectEl.appendChild(option);
    });

    function showData() {
        const selectedIndex = selectEl.value;
        const card = document.getElementById('resultCard');
        
        if (selectedIndex === "") {
            card.classList.remove('active');
            return;
        }

        const person = dataPIP[selectedIndex];
        document.getElementById('resNama').textContent = person.nama;
        document.getElementById('resKelas').textContent = person.kelas;
        document.getElementById('resNISN').textContent = person.nisn;
        document.getElementById('resTempat').textContent = person.tempat;
        document.getElementById('resTgl').textContent = person.tgl;
        document.getElementById('resCair').textContent = "Paling cepat " + person.cair;
        
        card.classList.add('active');
    }
